services:
  ds:
    build: ds

  git:
    build:
      context: .
      dockerfile: git.Dockerfile

  front:
    build:
      context: front
      additional_contexts:
        deciphraze-ds: service:ds
        deciphraze-git: service:git
    develop:
      watch:
        - action: sync
          path: ./src
          target: /deciphraze/src
        - action: rebuild
          path: ./package.json
    ports:
      - "1111:1111"